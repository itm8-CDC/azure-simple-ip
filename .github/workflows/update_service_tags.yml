name: Update Azure IP files

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update_service_tags
  cancel-in-progress: false

jobs:
  update_service_tags:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Refresh IP files
        run: |
          output_dir=$(mktemp -d)
          uv run --locked python main.py --output-dir "$output_dir"
          rsync --archive --delete "$output_dir/service_tags/" service_tags/
          cp "$output_dir/service_tags_public_latest.txt" service_tags_public_latest.txt

      - name: Commit changed IP files
        run: |
          git add -- service_tags service_tags_public_latest.txt
          if git diff --cached --quiet; then
            echo "Azure IP files are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Azure IP files"
          git push
